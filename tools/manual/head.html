<title>ResoQBand Příručka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky table of contents on the left, one reading column; screenshots as framed figures, settings as "recipe" cards */
:root {
  --bg: #f4f4f1;
  --surface: #ffffff;
  --surface-2: #ecebe4;
  --fg: #1b1a17;
  --fg-dim: #5f5d55;
  --line: #d9d7cd;
  --accent: #8a6100;        /* the yellow result curve, darkened for a light page */
  --accent-soft: #f6ebc9;
  --band: #0e7f93;          /* cyan band colour */
  --band-soft: #d6eef2;
  --cut: #c43d63;
  --cut-soft: #f7dde5;
  --shot-edge: #1d1e22;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111215; --surface: #18191d; --surface-2: #212228; --fg: #e6e6ea; --fg-dim: #9a9ba4;
    --line: #2d2e35; --accent: #f4c95d; --accent-soft: #3a3020; --band: #38d6f0; --band-soft: #15323a;
    --cut: #ff7d9b; --cut-soft: #3e2230; --shot-edge: #2d2e35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111215; --surface: #18191d; --surface-2: #212228; --fg: #e6e6ea; --fg-dim: #9a9ba4;
  --line: #2d2e35; --accent: #f4c95d; --accent-soft: #3a3020; --band: #38d6f0; --band-soft: #15323a;
  --cut: #ff7d9b; --cut-soft: #3e2230; --shot-edge: #2d2e35;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  padding-inline: 20px; padding-block: 0 64px;
}
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.page { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 48px; }
@media (max-width: 900px) { .page { grid-template-columns: minmax(0, 1fr); gap: 0; } nav.toc { display: none; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; padding-top: 40px; font-size: 14.5px; max-height: calc(100vh - 48px); overflow-y: auto; }
nav.toc p { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-dim); margin: 0 0 10px; }
nav.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
nav.toc a { display: block; padding: 4px 10px; border-radius: 6px; color: var(--fg-dim); text-decoration: none; }
nav.toc a:hover { background: var(--surface-2); color: var(--fg); }
nav.toc .genre a { color: var(--fg); font-weight: 600; }

main { min-width: 0; }
.doc { max-width: 820px; }

header.hero { padding-block: 44px 28px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: 1.05; margin: 0 0 16px; text-wrap: balance; letter-spacing: -.01em; }
h1 .q { color: var(--accent); }
.lede { font-size: 1.15rem; color: var(--fg-dim); margin: 0; max-width: 62ch; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.meta span { font-family: var(--font-mono); font-size: 12.5px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--fg-dim); background: var(--surface); }

h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1.15; margin: 64px 0 14px; text-wrap: balance; scroll-margin-top: 24px; }
h2 .num { font-family: var(--font-mono); font-size: .9rem; font-weight: 400; color: var(--fg-dim); margin-right: 10px; vertical-align: .35em; }
h3 { font-family: var(--font-display); font-weight: 500; font-size: 1.3rem; margin: 36px 0 8px; text-wrap: balance; scroll-margin-top: 24px; }
p, li { max-width: 68ch; }
ul, ol { padding-left: 1.3em; }
li + li { margin-top: 4px; }
code, kbd { font-family: var(--font-mono); font-size: .86em; }
kbd { padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); white-space: nowrap; }
.dim { color: var(--fg-dim); }

figure { margin: 22px 0 26px; }
figure.shot img { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--shot-edge); background: #0b0c0f; }
figure.strip img { display: block; width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--shot-edge); background: #0b0c0f; }
figure.narrow { max-width: 520px; }
figure svg { width: 100%; height: auto; display: block; }
figcaption { font-size: 14px; color: var(--fg-dim); margin-top: 8px; max-width: 72ch; }

.genre-head { margin-top: 72px; padding: 22px 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.genre-head h2 { margin: 0 0 6px; }
.genre-head p { margin: 0; color: var(--fg-dim); }
.genre-head .tempo { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent); margin-bottom: 8px; letter-spacing: .04em; }

.recipe { margin: 18px 0 26px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.recipe-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; padding: 14px 18px 10px; }
.recipe-head h4 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 1.12rem; }
.recipe-head .where { font-family: var(--font-mono); font-size: 12px; color: var(--fg-dim); }
.settings { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 12px; }
.chip { font-family: var(--font-mono); font-size: 12.5px; padding: 3px 9px; border-radius: 6px; background: var(--surface-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip b { font-weight: 600; color: var(--accent); }
.chip.band { background: var(--band-soft); }
.chip.dyn { background: var(--cut-soft); }
.recipe-body { padding: 12px 18px 14px; border-top: 1px solid var(--line); font-size: 16px; }
.recipe-body p { margin: 0 0 8px; }
.recipe-body p:last-child { margin-bottom: 0; }

.note { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 12px 16px; border-radius: 0 8px 8px 0; margin: 20px 0; }
.note.warn { border-color: var(--cut); background: var(--cut-soft); }
.note.info { border-color: var(--band); background: var(--band-soft); }
.note p { margin: 0; }
.note strong { display: block; margin-bottom: 2px; }

.table-wrap { overflow-x: auto; margin: 16px 0 24px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-dim); font-weight: 600; background: var(--surface-2); }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td:first-child { font-weight: 600; }
tr.cat td { background: var(--surface-2); font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-dim); font-weight: 600; }

.steps { counter-reset: s; list-style: none; padding: 0; display: grid; gap: 10px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; max-width: none; }
.steps li::before { content: counter(s); font-family: var(--font-mono); font-weight: 600; font-size: 14px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: var(--bg); margin-top: 1px; }

.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 12px 0 18px; font-family: var(--font-mono); font-size: 13px; }
.chain span { padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.chain span.me { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chain i { font-style: normal; color: var(--fg-dim); }

.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 20px; margin: 10px 0 20px; padding: 0; list-style: none; font-size: 15px; }
.legend li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: baseline; max-width: none; margin: 0; }
.legend b { font-family: var(--font-mono); font-size: 12px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--bg); }

.lang { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-family: var(--font-mono); font-size: 12px; }
.lang a, .lang span { padding: 3px 10px; border-radius: 999px; text-decoration: none; color: var(--fg-dim); }
.lang span { background: var(--accent); color: var(--bg); font-weight: 600; }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.hero-top .eyebrow { margin: 0; }
nav.toc .lang { margin-bottom: 18px; }
footer { margin-top: 72px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 14px; color: var(--fg-dim); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto !important; } }
html { scroll-behavior: smooth; }
</style>
