name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DRESOOG_TESTS=ON

      - name: Build plug-in and tests
        run: cmake --build build --config Release --parallel 4 --target ResoOG_VST3 ResoOGTests

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        run: ./ResoOGTests_artefacts/Release/ResoOGTests.exe "ResoOG_artefacts/Release/VST3/ResoOG.vst3"

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        working-directory: build
        run: ./ResoOGTests_artefacts/Release/ResoOGTests "ResoOG_artefacts/Release/VST3/ResoOG.vst3"

      - uses: actions/upload-artifact@v4
        with:
          name: ResoOG-VST3-${{ runner.os }}
          path: build/ResoOG_artefacts/Release/VST3/
